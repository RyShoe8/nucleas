<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Nucleas</title><link rel="stylesheet" href="launcher.css"></head>
<body><section class="shell">
<header><div class="identity"><span class="orb">n</span><div><strong>nucleas<span class="dot">.</span></strong><small>YOUR COMPANY. IN REACH.</small></div></div><div class="controls"><button id="compact" title="Collapse launcher" aria-label="Collapse launcher">−</button><button id="hide" title="Hide to tray · Alt+Space" aria-label="Hide launcher">×</button></div></header>
<main><button id="ask" class="ask"><span class="spark">✦</span><div><strong>What’s next?</strong><span>Ask Nucleas anything</span></div><span class="arrow">↗</span></button>
<label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Find an app…" aria-label="Find an app"><kbd>ESC</kbd></label>
<div class="section-title"><span>YOUR APPS</span><span id="count"></span></div><div id="apps" class="apps" role="list"></div><p id="empty" hidden>No apps match that search.</p>
</main><footer><button id="update" title="Check for updates"><span id="status-dot"></span><span id="status">Connecting…</span></button><kbd>ALT SPACE</kbd></footer><p id="error" role="alert" hidden></p></section><script src="launcher.js"></script></body></html>
