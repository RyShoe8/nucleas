<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Nucleas</title><link rel="stylesheet" href="launcher.css"></head>
<body><section class="shell">
<header><div class="identity"><span class="orb">n</span><div><strong>nucleas<span class="dot">.</span></strong><small>YOUR COMPANIES. YOUR TEAM.</small></div></div><div class="controls"><button id="compact" title="Collapse launcher" aria-label="Collapse launcher">−</button><button id="hide" title="Hide to tray · Alt+Space" aria-label="Hide launcher">×</button></div></header>
<main><div class="ask-row"><button id="ask" class="ask"><span class="spark">✦</span><div><strong>What’s next?</strong><span>Set direction. Give your team an outcome.</span></div><span class="arrow">↗</span></button><button id="voice" class="voice" title="Talk to Nucleas" aria-label="Talk to Nucleas"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 11a7 7 0 01-14 0M12 18v4M8 22h8M12 15a3 3 0 003-3V5a3 3 0 00-6 0v7a3 3 0 003 3z"/></svg></button></div>
<label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Find a workspace…" aria-label="Find a workspace"><kbd>ESC</kbd></label>
<div class="section-title"><span>YOUR WORKSPACE</span><span id="count"></span></div><div id="apps" class="apps" role="list"></div><p id="empty" hidden>No workspaces match that search.</p>
</main><footer><button id="update" title="Check for updates"><span id="status-dot"></span><span id="status">Connecting…</span></button><kbd>ALT SPACE</kbd></footer><p id="error" role="alert" hidden></p></section><script src="launcher.js"></script></body></html>
