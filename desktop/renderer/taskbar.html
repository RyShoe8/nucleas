<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Nucleas taskbar</title><link rel="stylesheet" href="taskbar.css"></head>
<body><main aria-label="Nucleas taskbar">
  <button id="office" class="office" title="Open Nucleas Office · Alt+Space" aria-label="Open Nucleas Office"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5l10-2v18M14 8h6v13M2 21h20M8 8h2M8 12h2M8 16h2M17 12h1M17 16h1"/></svg></button>
  <form id="ask-form"><span class="spark" aria-hidden="true">✦</span><input id="question" aria-label="Ask Nucleas" placeholder="Ask Nucleas…" maxlength="4000" autocomplete="off"><button id="send" type="submit" title="Send to Ask" aria-label="Send to Ask">↵</button></form>
  <button id="compact-ask" title="Open Ask Nucleas" aria-label="Open Ask Nucleas">✦</button>
  <nav id="windows" aria-label="Minimized Nucleas windows"></nav>
  <button id="overflow" title="Minimized windows" aria-label="Show all minimized Nucleas windows" hidden>…</button>
  <span id="notice" role="status" aria-live="polite" hidden></span>
</main><script src="taskbar.js"></script></body></html>
